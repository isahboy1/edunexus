<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Student in hijab checking the school portal on her phone beside floating interface cards">
  <defs>
    <linearGradient id="rtl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153849"/>
      <stop offset="0.55" stop-color="#18374b"/>
      <stop offset="1" stop-color="#365d4c"/>
    </linearGradient>
    <radialGradient id="rtl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#71977b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#71977b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rtl-bg)"/>

  <!-- Arches -->
  <g fill="#ffffff" opacity="0.05">
    <path d="M48 430V258c0-64 50-106 92-130 42 24 92 66 92 130v172Z"/>
    <path d="M546 430V258c0-64 50-106 92-130 42 24 92 66 92 130v172Z"/>
    <path d="M300 430V280c0-50 39-84 72-102 33 18 72 52 72 102v150Z"/>
  </g>
  <g fill="none" stroke="#83aaa1" stroke-opacity="0.16" stroke-width="3">
    <path d="M48 430V258c0-64 50-106 92-130 42 24 92 66 92 130v172"/>
    <path d="M546 430V258c0-64 50-106 92-130 42 24 92 66 92 130v172"/>
  </g>

  <!-- Glow behind the main figure -->
  <ellipse cx="398" cy="330" rx="240" ry="200" fill="url(#rtl-glow)"/>

  <!-- Ground -->
  <path d="M0 430h800v70H0z" fill="#061531"/>
  <path d="M0 430h800" stroke="#71977b" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ══ Female student · hijab, phone in hand ══ -->
  <g>
    <!-- abaya -->
    <path d="M366 430c-5-84 1-122 14-138 7-9 17-13 30-13s23 4 30 13c13 16 19 54 14 138Z" fill="#234555"/>
    <path d="M366 430c-5-84 1-122 14-138 7-9 17-13 30-13" fill="none" stroke="#71977b" stroke-opacity="0.5" stroke-width="3"/>
    <!-- raised arm holding phone -->
    <path d="M398 336c-18 6-34 26-38 50" fill="none" stroke="#234555" stroke-width="17" stroke-linecap="round"/>
    <path d="M360 386c-8-10-8-24 0-32" fill="none" stroke="#8a5a2b" stroke-width="15" stroke-linecap="round"/>
    <!-- shoes -->
    <rect x="376" y="420" width="28" height="12" rx="6" fill="#0a1836"/>
    <rect x="411" y="420" width="28" height="12" rx="6" fill="#0a1836"/>
    <!-- hijab -->
    <circle cx="410" cy="248" r="45" fill="#71977b"/>
    <circle cx="411" cy="256" r="26" fill="#8a5a2b"/>
    <path d="M373 288c4 31 17 50 37 50s33-19 37-50c17 9 23 29 21 52-25 19-91 19-116 0-2-23 4-43 21-52Z" fill="#71977b"/>
    <path d="M373 288c4 31 17 50 37 50" fill="none" stroke="#0f8f5b" stroke-width="3" stroke-opacity="0.75"/>

    <!-- phone -->
    <g transform="rotate(-12 348 356)">
      <rect x="330" y="326" width="40" height="64" rx="7" fill="#0b1220"/>
      <rect x="334" y="332" width="32" height="52" rx="4" fill="#eef5fe"/>
      <rect x="338" y="338" width="24" height="6" rx="3" fill="#5d9388"/>
      <rect x="338" y="348" width="16" height="4" rx="2" fill="#98a2b3"/>
      <circle cx="344" cy="364" r="6" fill="#71977b"/>
      <path d="M341.5 364l2 2 3.5-3.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="354" y="361" width="12" height="4" rx="2" fill="#dfeae5"/>
      <rect x="338" y="374" width="24" height="4" rx="2" fill="#dfeae5"/>
    </g>
  </g>

  <!-- ══ Male student · kufi, backpack ══ -->
  <g>
    <!-- backpack behind -->
    <rect x="556" y="316" width="54" height="74" rx="14" fill="#0a1e48"/>
    <path d="M566 316c0-20 34-20 34 0" fill="none" stroke="#0a1e48" stroke-width="7"/>
    <!-- thobe -->
    <path d="M548 430c-5-76 0-110 12-124 6-8 15-12 26-12s20 4 26 12c12 14 18 48 12 124Z" fill="#eef2f8"/>
    <path d="M560 294c-6 14-9 42-9 82" fill="none" stroke="#c9d6ea" stroke-width="3"/>
    <!-- backpack strap -->
    <path d="M572 302c14 8 22 24 24 44" fill="none" stroke="#0a1e48" stroke-width="8" stroke-linecap="round"/>
    <!-- arm -->
    <path d="M586 342c-12 24-14 48-8 70" fill="none" stroke="#eef2f8" stroke-width="16" stroke-linecap="round"/>
    <!-- shoes -->
    <rect x="558" y="420" width="27" height="12" rx="6" fill="#0a1836"/>
    <rect x="590" y="420" width="27" height="12" rx="6" fill="#0a1836"/>
    <!-- head + kufi -->
    <circle cx="586" cy="270" r="31" fill="#6b3f1d"/>
    <path d="M560 252a27 25 0 0 1 53 0Z" fill="#f4f7fb"/>
    <rect x="558" y="246" width="57" height="9" rx="4.5" fill="#5d9388"/>
    <path d="M574 298h24l-12 14Z" fill="#dfeae5"/>
    <!-- tablet under arm -->
    <g transform="rotate(8 614 384)">
      <rect x="598" y="358" width="36" height="50" rx="5" fill="#18374b"/>
      <rect x="602" y="363" width="28" height="40" rx="3" fill="#afc9bf"/>
    </g>
  </g>

  <!-- ══ Floating portal cards ══ -->
  <!-- Fee card -->
  <g transform="translate(118 116)">
    <rect width="196" height="104" rx="14" fill="#ffffff" opacity="0.97"/>
    <rect x="18" y="18" width="66" height="8" rx="4" fill="#18374b"/>
    <rect x="18" y="34" width="42" height="6" rx="3" fill="#98a2b3"/>
    <text x="18" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#18374b">₦76,000</text>
    <rect x="18" y="84" width="106" height="6" rx="3" fill="#eef5fe"/>
    <rect x="18" y="84" width="62" height="6" rx="3" fill="#71977b"/>
    <circle cx="166" cy="66" r="16" fill="#d9f2e4"/>
    <path d="M159 66l5 5 9-10" fill="none" stroke="#71977b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Registration card -->
  <g transform="translate(566 96)">
    <rect width="176" height="132" rx="14" fill="#ffffff" opacity="0.97"/>
    <rect x="16" y="16" width="82" height="8" rx="4" fill="#18374b"/>
    <rect x="16" y="32" width="52" height="6" rx="3" fill="#98a2b3"/>
    <g>
      <circle cx="24" cy="58" r="8" fill="#71977b"/>
      <path d="M20.5 58l2.5 2.5L28 55.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="40" y="54" width="96" height="7" rx="3.5" fill="#dfeae5"/>
    </g>
    <g>
      <circle cx="24" cy="82" r="8" fill="#71977b"/>
      <path d="M20.5 82l2.5 2.5L28 79.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="40" y="78" width="80" height="7" rx="3.5" fill="#dfeae5"/>
    </g>
    <g>
      <circle cx="24" cy="106" r="8" fill="#5d9388"/>
      <path d="M24 101v10M19 106h10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <rect x="40" y="102" width="88" height="7" rx="3.5" fill="#eef5fe"/>
    </g>
  </g>

  <!-- Small progress chip -->
  <g transform="translate(148 300)">
    <rect width="132" height="52" rx="12" fill="#18374b" opacity="0.85"/>
    <circle cx="28" cy="26" r="13" fill="none" stroke="#71977b" stroke-width="5" stroke-dasharray="62 20" transform="rotate(-90 28 26)"/>
    <text x="52" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">SEMESTER</text>
    <text x="52" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#afc9bf">16 units · 7 courses</text>
  </g>
</svg>
