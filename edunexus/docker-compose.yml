services:
  db:
    image: postgres:17-alpine
    container_name: edunexus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: edunexus
      POSTGRES_PASSWORD: edunexus_dev_password
      POSTGRES_DB: edunexus
    ports:
      - "5433:5432"
    volumes:
      - edunexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edunexus -d edunexus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  edunexus_pgdata:
