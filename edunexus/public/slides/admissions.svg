<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Two students in modest Islamic dress walking across campus with application documents">
  <defs>
    <linearGradient id="adm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153849"/>
      <stop offset="1" stop-color="#27566a"/>
    </linearGradient>
    <linearGradient id="adm-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122e3e"/>
      <stop offset="1" stop-color="#102237"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#adm-bg)"/>

  <!-- Pointed-arch campus arcade -->
  <g fill="#ffffff" opacity="0.05">
    <path d="M40 430V252c0-68 54-112 98-138 44 26 98 70 98 138v178Z"/>
    <path d="M280 430V266c0-60 47-99 84-121 37 22 84 61 84 121v164Z"/>
    <path d="M520 430V258c0-64 51-106 93-130 42 24 93 66 93 130v172Z"/>
    <path d="M730 430V290c0-46 36-77 66-94v139Z"/>
  </g>
  <!-- Arch outlines for definition -->
  <g fill="none" stroke="#83aaa1" stroke-opacity="0.18" stroke-width="3">
    <path d="M40 430V252c0-68 54-112 98-138 44 26 98 70 98 138v178"/>
    <path d="M280 430V266c0-60 47-99 84-121 37 22 84 61 84 121v164"/>
    <path d="M520 430V258c0-64 51-106 93-130 42 24 93 66 93 130v172"/>
  </g>

  <!-- Distant dome -->
  <g opacity="0.5">
    <path d="M668 168a34 30 0 0 1 68 0Z" fill="#5d9388" opacity="0.5"/>
    <rect x="676" y="168" width="52" height="60" fill="#27566a"/>
    <path d="M702 128v14" stroke="#71977b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="702" cy="124" r="5" fill="#71977b"/>
  </g>

  <!-- Ground -->
  <path d="M0 430h800v70H0z" fill="url(#adm-floor)"/>
  <path d="M0 430h800" stroke="#83aaa1" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Greenery -->
  <g fill="#14563f">
    <circle cx="74" cy="424" r="20"/>
    <circle cx="104" cy="428" r="15"/>
    <circle cx="48" cy="430" r="14"/>
    <circle cx="744" cy="426" r="18"/>
    <circle cx="770" cy="430" r="13"/>
  </g>
  <g fill="#71977b" opacity="0.55">
    <circle cx="74" cy="418" r="11"/>
    <circle cx="744" cy="420" r="10"/>
  </g>

  <!-- Background student (depth) -->
  <g opacity="0.35">
    <path d="M626 424c-3-52 0-74 8-83 4-5 9-7 15-7s11 2 15 7c8 9 11 31 8 83Z" fill="#0d2b60"/>
    <circle cx="644" cy="326" r="20" fill="#0d2b60"/>
    <path d="M636 318a9 8 0 0 1 17 0Z" fill="#dfeae5"/>
  </g>

  <!-- ══ Female student · hijab + abaya, folder ══ -->
  <g>
    <!-- abaya -->
    <path d="M314 424c-5-74 1-108 13-122 6-8 15-11 26-11s20 3 26 11c12 14 18 48 13 122Z" fill="#12315f"/>
    <path d="M314 424c-5-74 1-108 13-122 6-8 15-11 26-11" fill="none" stroke="#83aaa1" stroke-opacity="0.35" stroke-width="3"/>
    <!-- arm carrying folder -->
    <path d="M336 336c-12 26-14 54-6 78" fill="none" stroke="#12315f" stroke-width="17" stroke-linecap="round"/>
    <!-- folder -->
    <g transform="rotate(-7 318 408)">
      <rect x="290" y="390" width="58" height="42" rx="5" fill="#f7f8f3"/>
      <rect x="290" y="390" width="58" height="11" rx="5" fill="#71977b"/>
      <rect x="299" y="408" width="34" height="4" rx="2" fill="#98a2b3"/>
      <rect x="299" y="417" width="24" height="4" rx="2" fill="#98a2b3"/>
    </g>
    <!-- shoes -->
    <rect x="322" y="420" width="26" height="12" rx="6" fill="#0a1836"/>
    <rect x="354" y="420" width="26" height="12" rx="6" fill="#0a1836"/>
    <!-- hijab -->
    <circle cx="340" cy="256" r="43" fill="#71977b"/>
    <circle cx="341" cy="263" r="25" fill="#8a5a2b"/>
    <!-- hijab drape over shoulders -->
    <path d="M304 292c4 30 16 48 36 48s32-18 36-48c16 9 22 28 20 50-24 18-88 18-112 0-2-22 4-41 20-50Z" fill="#71977b"/>
    <path d="M304 292c4 30 16 48 36 48" fill="none" stroke="#0f8f5b" stroke-width="3" stroke-opacity="0.7"/>
  </g>

  <!-- ══ Male student · kufi + thobe, books ══ -->
  <g>
    <!-- thobe -->
    <path d="M460 424c-6-80 0-116 13-131 6-8 15-12 27-12s21 4 27 12c13 15 19 51 13 131Z" fill="#eef2f8"/>
    <path d="M473 281c-6 15-9 44-9 86" fill="none" stroke="#c9d6ea" stroke-width="3"/>
    <!-- arm + books -->
    <path d="M484 330c-13 24-15 52-7 76" fill="none" stroke="#eef2f8" stroke-width="17" stroke-linecap="round"/>
    <g transform="rotate(6 456 410)">
      <rect x="424" y="388" width="60" height="13" rx="4" fill="#5d9388"/>
      <rect x="428" y="401" width="52" height="13" rx="4" fill="#71977b"/>
      <rect x="432" y="414" width="44" height="11" rx="4" fill="#dfeae5"/>
    </g>
    <!-- shoes -->
    <rect x="472" y="420" width="27" height="12" rx="6" fill="#0a1836"/>
    <rect x="505" y="420" width="27" height="12" rx="6" fill="#0a1836"/>
    <!-- head -->
    <circle cx="500" cy="272" r="31" fill="#7a4a21"/>
    <!-- kufi cap -->
    <path d="M474 254a27 25 0 0 1 53 0Z" fill="#f4f7fb"/>
    <rect x="472" y="248" width="57" height="9" rx="4.5" fill="#5d9388"/>
    <!-- collar -->
    <path d="M488 300h24l-12 14Z" fill="#dfeae5"/>
  </g>

  <!-- Accent: application checklist card floating top-left -->
  <g transform="translate(78 92)">
    <rect width="150" height="96" rx="12" fill="#ffffff" opacity="0.96"/>
    <rect x="16" y="18" width="70" height="8" rx="4" fill="#18374b"/>
    <rect x="16" y="34" width="46" height="6" rx="3" fill="#98a2b3"/>
    <g>
      <circle cx="22" cy="58" r="7" fill="#71977b"/>
      <path d="M19 58l2.5 2.5L26 56" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="36" y="55" width="82" height="6" rx="3" fill="#dfeae5"/>
    </g>
    <g>
      <circle cx="22" cy="78" r="7" fill="#71977b"/>
      <path d="M19 78l2.5 2.5L26 76" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="36" y="75" width="64" height="6" rx="3" fill="#dfeae5"/>
    </g>
  </g>
</svg>
