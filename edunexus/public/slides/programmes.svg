<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Students in hijab and kufi studying together with books and a laptop">
  <defs>
    <linearGradient id="prg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18374b"/>
      <stop offset="1" stop-color="#27566a"/>
    </linearGradient>
    <linearGradient id="prg-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#afc9bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#83aaa1" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#prg-bg)"/>

  <!-- Large study-hall arch window -->
  <path d="M280 430V214c0-72 56-118 120-146 64 28 120 74 120 146v216Z" fill="url(#prg-window)"/>
  <path d="M280 430V214c0-72 56-118 120-146 64 28 120 74 120 146v216" fill="none" stroke="#dfeae5" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M400 74v356M284 250h232" stroke="#dfeae5" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Side arches -->
  <g fill="#ffffff" opacity="0.05">
    <path d="M40 430V266c0-58 45-96 82-117 37 21 82 59 82 117v164Z"/>
    <path d="M596 430V266c0-58 45-96 82-117 37 21 82 59 82 117v164Z"/>
  </g>

  <!-- Bookshelf right -->
  <g transform="translate(636 250)">
    <rect width="128" height="164" rx="10" fill="#18374b"/>
    <g>
      <rect x="10" y="12" width="14" height="52" rx="2" fill="#71977b"/>
      <rect x="27" y="20" width="12" height="44" rx="2" fill="#f7f8f3"/>
      <rect x="42" y="8" width="16" height="56" rx="2" fill="#83aaa1"/>
      <rect x="61" y="16" width="12" height="48" rx="2" fill="#71977b" opacity="0.7"/>
      <rect x="76" y="10" width="15" height="54" rx="2" fill="#dfeae5"/>
      <rect x="94" y="22" width="22" height="42" rx="2" fill="#5d9388"/>
    </g>
    <path d="M6 76h116" stroke="#5d9388" stroke-opacity="0.6" stroke-width="4"/>
    <g>
      <rect x="10" y="88" width="13" height="54" rx="2" fill="#dfeae5"/>
      <rect x="26" y="96" width="16" height="46" rx="2" fill="#5d9388"/>
      <rect x="45" y="86" width="12" height="56" rx="2" fill="#71977b"/>
      <rect x="60" y="94" width="15" height="48" rx="2" fill="#f7f8f3"/>
      <rect x="78" y="90" width="13" height="52" rx="2" fill="#83aaa1" opacity="0.8"/>
      <rect x="94" y="98" width="22" height="44" rx="2" fill="#71977b" opacity="0.6"/>
    </g>
  </g>

  <!-- Floor -->
  <path d="M0 430h800v70H0z" fill="#102237"/>
  <path d="M0 430h800" stroke="#83aaa1" stroke-opacity="0.3" stroke-width="2"/>

  <!-- ══ Female student (left) · blue hijab, taking notes ══ -->
  <g>
    <!-- torso -->
    <path d="M236 430c-4-76 4-112 18-126 7-8 16-12 28-12s21 4 28 12c14 14 22 50 18 126Z" fill="#234555"/>
    <!-- arm to notebook -->
    <path d="M262 344c-14 24-18 48-12 70" fill="none" stroke="#234555" stroke-width="16" stroke-linecap="round"/>
    <!-- hijab -->
    <circle cx="282" cy="256" r="42" fill="#83aaa1"/>
    <circle cx="283" cy="263" r="24" fill="#6b3f1d"/>
    <path d="M247 292c4 29 15 46 35 46s31-17 35-46c15 9 21 27 19 48-23 17-85 17-108 0-2-21 4-39 19-48Z" fill="#83aaa1"/>
    <path d="M247 292c4 29 15 46 35 46" fill="none" stroke="#27566a" stroke-width="3" stroke-opacity="0.8"/>
  </g>

  <!-- ══ Male student (right) · kufi + cream thobe, reading ══ -->
  <g>
    <path d="M488 430c-5-78 0-114 13-128 6-8 15-12 27-12s21 4 27 12c13 14 19 50 13 128Z" fill="#f7f8f3"/>
    <path d="M501 290c-6 15-9 43-9 84" fill="none" stroke="#dfeae5" stroke-width="3"/>
    <!-- arm holding book -->
    <path d="M512 344c-14 22-18 46-13 68" fill="none" stroke="#f7f8f3" stroke-width="16" stroke-linecap="round"/>
    <circle cx="528" cy="272" r="31" fill="#7a4a21"/>
    <path d="M502 254a27 25 0 0 1 53 0Z" fill="#f4f7fb"/>
    <rect x="500" y="248" width="57" height="9" rx="4.5" fill="#71977b"/>
    <path d="M516 300h24l-12 14Z" fill="#dfeae5"/>
    <!-- book in hand -->
    <g transform="rotate(-10 506 402)">
      <path d="M474 384h30v34h-30Z" fill="#18374b"/>
      <path d="M508 384h30v34h-30Z" fill="#234555"/>
      <path d="M504 384h6v34h-6Z" fill="#f7f8f3"/>
      <path d="M474 384l30 6M538 384l-30 6" stroke="#f7f8f3" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- ══ Study table ══ -->
  <g>
    <rect x="150" y="392" width="500" height="18" rx="9" fill="#18374b"/>
    <rect x="176" y="410" width="16" height="60" fill="#18374b"/>
    <rect x="608" y="410" width="16" height="60" fill="#18374b"/>
    <path d="M150 392h500" stroke="#83aaa1" stroke-opacity="0.45" stroke-width="3"/>

    <!-- open book -->
    <g transform="translate(318 360)">
      <path d="M0 34c14-10 30-10 44 0V6c-14-8-30-8-44 0Z" fill="#f7f8f3"/>
      <path d="M92 34c-14-10-30-10-44 0V6c14-8 30-8 44 0Z" fill="#dfeae5"/>
      <path d="M44 6v28" stroke="#98a2b3" stroke-width="2"/>
      <g stroke="#98a2b3" stroke-width="2" stroke-linecap="round">
        <path d="M8 14h26M8 22h24M56 14h26M56 22h24"/>
      </g>
    </g>

    <!-- notebook under left student's hand -->
    <g transform="translate(214 372)">
      <rect width="76" height="26" rx="4" fill="#f7f8f3"/>
      <rect width="76" height="7" rx="4" fill="#71977b"/>
      <g stroke="#98a2b3" stroke-width="2" stroke-linecap="round">
        <path d="M10 16h44M10 22h30"/>
      </g>
    </g>

    <!-- laptop -->
    <g transform="translate(430 334)">
      <rect x="4" y="0" width="86" height="58" rx="6" fill="#18374b"/>
      <rect x="10" y="6" width="74" height="46" rx="3" fill="#afc9bf"/>
      <g stroke="#18374b" stroke-width="3" stroke-linecap="round" opacity="0.65">
        <path d="M18 18h44M18 28h56M18 38h34"/>
      </g>
      <path d="M-6 64h102l-6-6H0Z" fill="#f7f8f3"/>
    </g>

    <!-- coffee cup -->
    <g transform="translate(586 366)">
      <rect width="26" height="26" rx="5" fill="#f7f8f3"/>
      <path d="M26 6h7a6 6 0 0 1 0 12h-7" fill="none" stroke="#f7f8f3" stroke-width="4"/>
      <path d="M6 4c2-6 12-6 14 0" fill="none" stroke="#98a2b3" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Plant left -->
  <g transform="translate(74 356)">
    <path d="M14 74h44l-7 34H21Z" fill="#18374b"/>
    <path d="M36 74C36 44 22 34 8 30c6 22 14 34 28 44Z" fill="#71977b"/>
    <path d="M36 74c0-26 14-36 28-40-6 20-14 32-28 40Z" fill="#365d4c"/>
    <path d="M36 74c0-18 2-34 2-46" stroke="#547a62" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
